<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanKit — Borrow Smart. Know the Real Cost.</title>
<meta name="description" content="EMI calculator, amortisation, prepayment simulator and loan comparison — in plain words, on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf5ec; --paper2:#f3ead8; --card:#fffdf7; --ink:#2b1d12; --ink2:#5c4a36; --ink3:#8a7660;
  --line:#e7dcc4; --bronze:#b07d2b; --gold:#d9a441; --terra:#c05b2e; --terra-soft:#f6e3d3;
  --green:#4a7a3f; --green-soft:#e4ecdd; --red:#a83c22; --red-soft:#fbe4dc;
  --shadow:0 10px 30px rgba(43,29,18,.08); --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--bronze)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
.pill.gold{background:#f7e8c8;color:#7a5510}.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.terra{background:var(--terra-soft);color:var(--terra)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.bronze{background:linear-gradient(135deg,#c08a2e,#a06e1d);color:#fff;box-shadow:0 6px 16px rgba(176,125,43,.35)}
.btn.terra{background:var(--terra);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 14px;font-size:13px;border-radius:10px}
section{padding:34px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-head h2{font-size:30px}
.sec-head p{color:var(--ink2);font-size:14px;max-width:520px}
.num{font-variant-numeric:tabular-nums}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 100% at 50% 0%,#3a2a18 0%,#241a0e 55%,#1a120a 100%);color:#f7ead0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.coin{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4cd6d,#c08a2e 60%,#8a5f16);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-size:46px;font-weight:700;color:#2b1d12;box-shadow:0 0 0 6px rgba(217,164,65,.25),0 18px 40px rgba(0,0,0,.5);animation:coinIn .9s cubic-bezier(.2,.9,.3,1.2) both,coinFloat 3.2s ease-in-out 1s infinite}
@keyframes coinIn{from{transform:scale(.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#intro h1{font-size:clamp(38px,8vw,58px);margin:22px 0 8px;animation:fadeUp .8s .25s both}
#intro .tag{font-size:17px;color:#e8d5a8;max-width:440px;animation:fadeUp .8s .45s both}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(247,234,208,.2);border-radius:99px;margin-top:34px;overflow:hidden;animation:fadeUp .8s .6s both}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a441,#f4cd6d);border-radius:99px;animation:fill 3.6s .3s ease forwards}
@keyframes fill{to{width:100%}}
#intro .skip{position:absolute;bottom:26px;right:26px;background:rgba(247,234,208,.12);border:1px solid rgba(247,234,208,.35);color:#f7ead0;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600}
#intro .skip:hover{background:rgba(247,234,208,.22)}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(250,245,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1060px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:22px;font-weight:700;text-decoration:none;color:var(--ink)}
.brand .mark{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4cd6d,#b07d2b 65%);display:flex;align-items:center;justify-content:center;color:#2b1d12;font-size:19px;box-shadow:0 3px 10px rgba(176,125,43,.4)}
.brand small{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.22em;color:var(--ink3);display:block;font-weight:700}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:8px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none}
nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;padding:0 0 30px}
.hero-photo{position:relative;height:400px;overflow:hidden;border-radius:0 0 26px 26px}
.hero-photo img{width:100%;height:100%;object-fit:cover;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-12px)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,18,10,.05) 40%,rgba(26,18,10,.72))}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:0 20px 26px;max-width:1060px;margin:0 auto;color:#fdf6e7;z-index:2}
.hero-copy h1{font-size:clamp(34px,6vw,54px);text-shadow:0 2px 18px rgba(0,0,0,.4)}
.hero-copy p{margin-top:8px;font-size:16.5px;color:#f3e5c8;max-width:560px;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.emi-dial{margin:-64px auto 0;position:relative;z-index:3;padding:26px 26px 22px}
.emi-top{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.emi-big{flex:1;min-width:240px}
.emi-big .lbl{font-size:12px;letter-spacing:.18em;font-weight:800;color:var(--ink3)}
.emi-big .val{font-family:Fraunces,serif;font-size:clamp(40px,7vw,56px);font-weight:700;line-height:1.05}
.emi-big .val span{font-size:20px;color:var(--ink2);font-weight:600}
.emi-big .sub{margin-top:6px;color:var(--ink2);font-size:14px}
.ring-wrap{width:150px;height:150px;flex:none;position:relative}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font-size:21px}
.ring-c span{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em}
.emi-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:#f7ead0;border-color:var(--ink)}
.chip:hover{border-color:var(--bronze)}
.emi-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.stat .k{font-size:11.5px;letter-spacing:.1em;font-weight:800;color:var(--ink3);text-transform:uppercase}
.stat .v{font-size:19px;font-weight:800;margin-top:3px}
.stat .d{font-size:12.5px;color:var(--ink2)}
/* ---------- sliders & calculator ---------- */
.calc-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.slider-row{padding:16px 0;border-bottom:1px solid var(--line)}
.slider-row:last-child{border-bottom:0}
.slider-row .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14.5px}
.slider-row .lab output{font-family:Fraunces,serif;font-size:21px;color:var(--terra)}
.slider-row .hint{font-size:12.5px;color:var(--ink3);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--gold) var(--fill,50%),#eadfc6 var(--fill,50%));margin-top:12px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fffdf7;border:3px solid var(--bronze);box-shadow:0 3px 10px rgba(43,29,18,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fffdf7;border:3px solid var(--bronze);cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px;color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--gold);border-color:var(--bronze)}
.verdict-line{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--paper2);font-size:14px}
/* ---------- donut / chart / table ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.legend{list-style:none;flex:1;min-width:200px}
.legend li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.legend li:last-child{border-bottom:0}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:1px}
canvas.chart{width:100%;height:210px;display:block}
table.ledger{width:100%;border-collapse:collapse;font-size:14px}
table.ledger th{text-align:left;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:10px 8px;border-bottom:2px solid var(--line)}
table.ledger td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.ledger td.r,table.ledger th.r{text-align:right}
table.ledger tr:last-child td{border-bottom:0}
.bar-track{height:12px;border-radius:99px;background:#eadfc6;overflow:hidden;display:flex}
.bar-track i{display:block;height:100%}
/* ---------- prepay / compare / afford ---------- */
.prepay-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.big-num{font-family:Fraunces,serif;font-size:30px;font-weight:700}
.scn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.scn{padding:20px;position:relative}
.scn.best{border:2px solid var(--gold)}
.scn h3{font-size:19px}
.scn .emi{font-family:Fraunces,serif;font-size:31px;font-weight:700;margin:8px 0 2px}
.scn ul{list-style:none;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.scn ul li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.scn ul li:last-child{border-bottom:0}
.gauge-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.check-list{list-style:none}
.check-list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check-list li:last-child{border-bottom:0}
.check-box{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--bronze);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;margin-top:1px}
.check-list li.done .check-box{background:var(--green);border-color:var(--green)}
.check-list li.done .ct{color:var(--ink3);text-decoration:line-through}
.rate-table{width:100%;border-collapse:collapse;font-size:14px}
.rate-table th{text-align:left;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:9px 8px;border-bottom:2px solid var(--line)}
.rate-table td{padding:9px 8px;border-bottom:1px solid var(--line)}
/* ---------- guides / footer ---------- */
.guide{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.guide summary{cursor:pointer;padding:16px 18px;font-weight:700;font-size:15.5px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary .chev{transition:transform .25s;color:var(--bronze);font-size:18px}
.guide[open ] summary .chev{transform:rotate(90deg)}
.guide .g-body{padding:0 18px 16px;color:var(--ink2);font-size:14.5px}
.guide .g-body b{color:var(--ink)}
footer{padding:26px 0 46px}
.foot-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.danger{color:var(--red);font-weight:700;background:none;border:0;padding:0;font-size:14px;text-decoration:underline}
/* ---------- coach / toast / drawer ---------- */
#coach{position:fixed;inset:0;z-index:150;background:rgba(26,18,10,.55);display:none;align-items:flex-end;justify-content:center;padding:18px}
#coach.show{display:flex}
.coach-card{background:var(--card);border-radius:20px;max-width:480px;width:100%;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:fadeUp .35s both}
.coach-card .step{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--bronze)}
.coach-card h3{font-size:24px;margin:8px 0}
.coach-card p{color:var(--ink2);font-size:15px}
.coach-dots{display:flex;gap:6px;margin:16px 0}
.coach-dots i{width:26px;height:5px;border-radius:99px;background:#e7dcc4}
.coach-dots i.on{background:var(--bronze)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);z-index:180;background:var(--ink);color:#f7ead0;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
@media(max-width:860px){
  .calc-grid,.split,.foot-grid{grid-template-columns:1fr}
  .scn-grid{grid-template-columns:1fr}
  .emi-stats{grid-template-columns:repeat(2,1fr)}
  .prepay-nums{grid-template-columns:1fr}
  nav{display:none}
  .hero-photo{height:330px}
  .sec-head{flex-direction:column;align-items:flex-start}
  .sec-head h2{font-size:26px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;transition-duration:.01s !important}
}
</style>
</head>
<body>
<div id="intro" role="dialog" aria-label="Welcome">
  <div class="coin">&#8377;</div>
  <h1>LoanKit</h1>
  <p class="tag">Borrow smart. Know the real cost before you sign.</p>
  <div class="bar"><i></i></div>
  <button class="skip" id="introSkip" type="button">Skip intro &rsaquo;</button>
</div>
